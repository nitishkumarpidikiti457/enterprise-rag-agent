[project]
name = "enterprise-rag-agent"
version = "0.1.0"
description = "Enterprise RAG & Agentic AI Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "redis>=5.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "reportlab>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.llm" = ["prompts/*.yaml"]
"app.api" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]