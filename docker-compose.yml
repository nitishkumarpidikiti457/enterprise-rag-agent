services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_BACKEND: fastembed
      RERANKER_BACKEND: fastembed
    volumes:
      - chroma:/app/.chroma
      - state:/app/.state
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  chroma:
  state:
